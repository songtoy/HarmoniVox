name: Inference source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-lock-cpu.txt
      - name: Install pinned CPU environment
        run: |
          python -m pip install pip==25.0 setuptools==69.5.1 wheel==0.45.1
          python -m pip install torch==2.3.0 torchaudio==2.3.0 torchvision==0.18.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-lock-cpu.txt
          python -m pip check
      - name: Check source scope and release behavior
        run: |
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
          python inference.py --help
          python scripts/package_release.py --output "$RUNNER_TEMP/HarmoniVox-inference.zip"

# Inference defaults. Model architecture lives in checkpoint/config.json.
# Paths below are relative to dataset_path; CLI paths override these defaults.
dataset_path: "../checkpoint"
mirror: ""
openi_token: ""

webui:
  device: "cuda"
  model: "."
  config_path: "config.json"
  port: 7866
  share: false
  debug: false
  language_identification_library: "langid"

bert_gen:
  config_path: "config.json"
  num_processes: 1
  device: "cuda"
  use_multi_device: false

# Compatibility fields required by the legacy config reader.
# Training and preprocessing are outside this inference release.
resample:
  sampling_rate: 16000
  in_dir: "raw"
  out_dir: "wavs"
preprocess_text:
  transcription_path: "transcription.list"
  cleaned_path: "transcription.list.cleaned"
  train_path: "train.list"
  val_path: "val.list"
  config_path: "config.json"
emo_gen:
  config_path: "config.json"
  num_processes: 1
  device: "cuda"
  use_multi_device: false
train_ms:
  env: {}
  base: {use_base_model: false}
  model: "."
  config_path: "config.json"
  num_workers: 1
  spec_cache: false
  keep_ckpts: 1
server:
  models: []
translate:
  app_key: ""
  secret_key: ""
